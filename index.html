
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nopCommerce 4.90 → 5.00 Changes</title>

  <link rel="stylesheet"
        href="https://unpkg.com/diff2html@3.4.53/bundles/css/diff2html.min.css">
  <script src="https://unpkg.com/diff2html@3.4.53/bundles/js/diff2html.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
    }

    .downloads {
      margin: 20px 0;
    }

    .downloads a {
      margin-right: 16px;
    }

    #diff {
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>nopCommerce 4.90 → 5.00</h1>
  <p>Source code comparison and upgrade changes.</p>

  <div class="downloads">
    <a href="./nopcommerce-4.90-to-5.00.patch">
      Download patch
    </a>
    <a href="./nopcommerce-4.90-to-5.00.diff">
      Download readable diff
    </a>
    <a href="./changed-files.txt">
      Changed files
    </a>
  </div>

  <div id="diff">Loading code changes...</div>

  <script>
    fetch("./nopcommerce-4.90-to-5.00.diff")
      .then(response => {
        if (!response.ok) {
          throw new Error("Unable to load the diff file.");
        }
        return response.text();
      })
      .then(diff => {
        document.getElementById("diff").innerHTML =
          Diff2Html.html(diff, {
            drawFileList: true,
            matching: "lines",
            outputFormat: "side-by-side"
          });
      })
      .catch(error => {
        document.getElementById("diff").textContent = error.message;
      });
  </script>
</body>
</html>
